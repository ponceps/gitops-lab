# Declarative install of Argo CD + the bootstrap ApplicationSet.
#
#   helmfile apply        # install / reconcile everything
#   helmfile destroy      # remove everything
#
# `helmfile apply` uses the helm-diff plugin. Install it once with:
#   helm plugin install https://github.com/databus23/helm-diff
# or run `helmfile sync` (no diff required) for the first install.

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  # 1. Argo CD itself. Release name 'argocd' keeps resource names clean
  #    (argocd-server, argocd-repo-server, ...) instead of argo-cd-argocd-*.
  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    # Pinned for reproducibility (chart 9.5.19 -> Argo CD v3.4.3). Find newer with:
    #   helm repo add argo https://argoproj.github.io/argo-helm && helm search repo argo/argo-cd --versions
    version: 9.5.19
    values:
      - ./values/argo-cd.yaml

  # 2. Bootstrap ApplicationSet (officially recommended over app-of-apps).
  #    The git directory generator emits one Application per apps/* directory.
  #    Installed after Argo CD so the ApplicationSet CRD exists.
  - name: argocd-apps
    namespace: argocd
    chart: argo/argocd-apps
    # Pinned for reproducibility. Find newer with:
    #   helm search repo argo/argocd-apps --versions
    version: 2.0.5
    needs:
      - argocd/argocd
    values:
      - ./values/bootstrap.yaml
