# Bootstrap: one ApplicationSet that auto-discovers per-environment app overlays.
#
# The git directory generator scans apps/*/overlays/* and emits one Argo CD
# Application per (app, environment) pair. For apps/nginx/overlays/dev it
# generates Application "nginx-dev" deploying into the "dev" namespace; the
# overlay's directory (a kustomize overlay) is the source.
#
# Path variables (fasttemplate, NOT Helm — the chart passes them through):
#   {{path}}          -> apps/nginx/overlays/dev   (source path)
#   {{path[1]}}       -> nginx                      (app name segment)
#   {{path.basename}} -> dev                        (environment / namespace)
#
# NOTE: this repo is public, so Argo CD can clone it without credentials. If you
# make it private, give Argo CD read access (deploy key / repo credential) first.
# See the README.

applicationsets:
  apps:
    namespace: argocd
    generators:
      - git:
          repoURL: https://github.com/ponceps/gitops-lab.git
          revision: HEAD
          directories:
            - path: apps/*/overlays/*
    template:
      metadata:
        name: "{{path[1]}}-{{path.basename}}"
        # Authorize the matching Kargo Stage (project "nginx", stage = env) to
        # run its argocd-update step against this Application. Without this,
        # Kargo's promotion fails with "Application ... is not authorized".
        annotations:
          kargo.akuity.io/authorized-stage: "nginx:{{path.basename}}"
      spec:
        # Each app lands in its environment's AppProject (dev/stage/prod),
        # defined below — gives per-env guardrails (allowed repo/destinations).
        project: "{{path.basename}}"
        source:
          repoURL: https://github.com/ponceps/gitops-lab.git
          targetRevision: HEAD
          path: "{{path}}"
        destination:
          server: https://kubernetes.default.svc
          namespace: "{{path.basename}}"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

# One AppProject per environment. Each only trusts this repo as a source and
# may only deploy into its own namespace — so a dev app can't accidentally
# target prod. Namespace is whitelisted as a cluster resource to allow
# CreateNamespace=true on a fresh cluster; all namespaced kinds are allowed.
projects:
  dev: &envProject
    namespace: argocd
    description: dev environment
    sourceRepos:
      - https://github.com/ponceps/gitops-lab.git
    destinations:
      - server: https://kubernetes.default.svc
        namespace: dev
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"
  stage:
    <<: *envProject
    description: stage environment
    destinations:
      - server: https://kubernetes.default.svc
        namespace: stage
  prod:
    <<: *envProject
    description: prod environment
    destinations:
      - server: https://kubernetes.default.svc
        namespace: prod
