# Where the root app-of-apps pulls child Applications from.
#
# This repo is public, so Argo CD can clone it without credentials. If you make
# it private, register repo credentials in Argo CD (Settings > Repositories, or
# a `repo-*` secret) and keep the SSH/HTTPS URL below in sync.
repoURL: https://github.com/ponceps/gitops-lab.git
targetRevision: HEAD
# Directory in the repo holding child Application manifests.
path: apps
