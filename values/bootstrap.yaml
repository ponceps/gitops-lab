# Where the root app-of-apps pulls child Applications from.
#
# This repo is private, so Argo CD needs read access to clone it. Either:
#   - make the repo public, or
#   - register repo credentials in Argo CD (Settings > Repositories, or a
#     `repo-*` secret), then keep the SSH/HTTPS URL below in sync.
repoURL: https://github.com/ponceps/gitops-lab.git
targetRevision: HEAD
# Directory in the repo holding child Application manifests.
path: apps
